name: "godot-ci export"
on:
  push:
    tags:
      - '*'

# NOTE: If your `project.godot` is at the repository root, set `PROJECT_PATH` below to ".".

env:
  GODOT_VERSION: 4.3
  PROJECT_NAME: SpaceGoose
  PROJECT_PATH: .

jobs:
  export-windows:
    name: Windows Export
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:4.3
    env:
      TAG_NAME: ${{ github.ref_name }} # Extract tag name from github.ref
      EXPORT_FILENAME: "$PROJECT_NAME-${{ github.ref_name }}" # Use tag name as export filename
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_FILENAME.exe"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.TAG_NAME }} # Artifact name includes tag
          path: build/windows

  export-linux:
    name: Linux Export
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:4.3
    env:
      TAG_NAME: ${{ github.ref_name }} # Extract tag name from github.ref
      EXPORT_FILENAME: ${{ github.ref_name }} # Use tag name as export filename
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Linux" "$EXPORT_DIR/linux/$EXPORT_FILENAME.x86_64"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.TAG_NAME }} # Artifact name includes tag
          path: build/linux

  export-web:
    name: Web Export
    runs-on: ubuntu-20.04
    container:
      image: barichello/godot-ci:4.3
    env:
      TAG_NAME: ${{ github.ref_name }} # Extract tag name from github.ref
      EXPORT_FILENAME: ${{ github.ref_name }} # Use tag name as export filename
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Web Build
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ env.TAG_NAME }} # Artifact name includes tag
          path: build/web

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [export-windows, export-linux, export-web] # Ensure export jobs finish first
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: windows_build/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ github.ref_name }}
          path: linux_build/

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-${{ github.ref_name }}
          path: web_build/

      - name: Create Release
        uses: actions/create-release@v1 # Use v1 for compatibility.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          artifacts: |
            windows_build/windows/${{ env.PROJECT_NAME }}-${{ github.ref_name }}.exe
            linux_build/linux/${{ github.ref_name }}.x86_64
            web_build/web/index.html
            web_build/web/${{ github.ref_name }}.wasm
            web_build/web/${{ github.ref_name }}.pck
            web_build/web/${{ github.ref_name }}.js